site_name: Vector
site_description: A state management library for Roblox

theme:
  name: material
  logo: assets/vector-logo.png
  favicon: assets/vector-logo.png
  font:
    text: Inter
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/vector.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API:
      - Functions:
          - Write: api/write.md
          - Read: api/read.md
          - Listen: api/listen.md
      - Data Types:
          - Scalars: api/scalars.md
          - Vectors: api/vectors.md
          - Matrices: api/matrices.md
  - Internals:
      - Records and Data Flow: internals/architecture.md
      - Classification: internals/information-velocity.md
      - Compression: internals/compression.md
      - Parallelism: internals/parallelism.md
